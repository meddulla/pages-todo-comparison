<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A plain JavaScript project dashboard" />
    <title>Northstar Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="logo" href="#/dashboard"><span>◆</span> northstar</a>
      <nav aria-label="Main navigation">
        <a href="#/dashboard" data-route="dashboard">Overview</a>
        <a href="#/projects" data-route="projects">Projects</a>
        <a href="#/board" data-route="board">Task board</a>
      </nav>
      <div class="sidebar-bottom">
        <button id="theme-toggle">Toggle theme</button>
        <p>Plain JavaScript<br /><small id="build-label"></small></p>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <label class="search"><span>⌕</span><input id="global-search" type="search" placeholder="Search projects and tasks" /></label>
        <button class="notification" aria-label="Notifications">●</button>
        <div class="avatar">SD</div>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
